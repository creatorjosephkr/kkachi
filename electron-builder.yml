appId: com.kkachi.mail
productName: Kkachi
copyright: Copyright © 2026 Kkachi
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - build/tray*
  - build/icon.png
  - package.json
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}
  extendInfo:
    CFBundleDisplayName: Kkachi
    CFBundleDevelopmentRegion: en
    CFBundleLocalizations:
      - ko
      - en
    LSHasLocalizedDisplayName: true
  extraResources:
    - from: resources/mac/ko.lproj
      to: ko.lproj
    - from: resources/mac/en.lproj
      to: en.lproj
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-Windows-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${productName}-${version}-Windows-${arch}-Portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 까치
