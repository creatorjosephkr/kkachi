<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <defs>
    <mask id="magpieCutout">
      <rect x="0" y="0" width="22" height="22" fill="#FFFFFF" />
      <!-- Transparent cutouts for eye and white wing patch -->
      <circle cx="11.5" cy="7.2" r="0.8" fill="#000000" />
      <path d="M 7.1 11.4 C 8.3 10.3 9.7 10.6 9.7 11.9 C 9.7 12.8 8.6 13.7 7.3 13.7 C 6.6 13.7 6.5 12.3 7.1 11.4 Z" fill="#000000" />
    </mask>
  </defs>
  <!-- Minimalist Monochrome Magpie Carrying a Letter (macOS Template Compatible) -->
  <g mask="url(#magpieCutout)">
    <!-- Tail -->
    <path d="M 7.2 13.8 L 2.0 19.3 L 3.9 19.7 L 8.8 14.8 Z" fill="#000000" />
    <!-- Body & Head -->
    <path d="M 10.6 5.1 C 12.2 5.1 13.4 6.4 13.4 8.0 C 13.4 9.1 12.8 10.5 12.2 12.0 C 11.4 14.0 9.6 15.7 7.6 15.7 C 6.1 15.7 5.3 14.4 5.7 12.8 C 6.3 10.6 8.0 9.0 8.8 7.8 C 8.8 6.2 9.6 5.1 10.6 5.1 Z" fill="#000000" />
    <!-- Beak -->
    <path d="M 13.0 7.4 L 15.6 8.3 L 13.0 9.1 Z" fill="#000000" />
  </g>
  <!-- Letter in Beak -->
  <g transform="rotate(-10 15.2 8.6)">
    <rect x="14.6" y="6.8" width="5.8" height="4.2" rx="0.7" fill="none" stroke="#000000" stroke-width="1.35" />
    <path d="M 14.8 7.1 L 17.5 9.2 L 20.2 7.1" fill="none" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
